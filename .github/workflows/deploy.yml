name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.SERVER_HOST || '194.77.89.10' }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY || secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: /opt/artq/scripts/deploy.sh
